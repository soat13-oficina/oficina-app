services:
  db:
    image: postgres:15-alpine
    container_name: oficina_db
    environment:
      POSTGRES_USER: ${DB_USER:-oficina_user}
      POSTGRES_PASSWORD: ${DB_PASS:-oficina_123}
      POSTGRES_DB: ${DB_NAME:-oficina_db}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-oficina_user} -d ${DB_NAME:-oficina_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog
    container_name: oficina_mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

  api:
    build: .
    container_name: oficina_api
    ports:
      - "8081:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-oficina_db}
      DB_USER: ${DB_USER:-oficina_user}
      DB_PASS: ${DB_PASS:-oficina_123}
      JWT_SECRET: ${JWT_SECRET:-ASjhd8213u41jksaJD7HS8AJDkjsaDH871A2132KJDQ293N12BDKS}
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
    depends_on:
      db:
        condition: service_healthy
      mailhog:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
