services:
  db:
    image: postgres:15-alpine
    container_name: oficina_db
    environment:
      POSTGRES_USER: ${DB_USER:-oficina_user}
      POSTGRES_PASSWORD: ${DB_PASS:-oficina_123}
      POSTGRES_DB: ${DB_NAME:-oficina_db}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-oficina_user} -d ${DB_NAME:-oficina_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog
    container_name: oficina_mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

  # Filas SQS FIFO da Saga (ADR 0005) e tabelas DynamoDB da Execution (ADR 0006). Imagem fixada: as
  # 2026.x exigem token de conta. Ver docs/arquitetura/mensageria-local.md.
  localstack:
    image: localstack/localstack:4.14.0
    container_name: oficina_localstack
    environment:
      SERVICES: sqs,dynamodb
    ports:
      - "4566:4566"
    volumes:
      - ./scripts/localstack:/etc/localstack/init/ready.d:ro
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs get-queue-url --queue-name oficina-local-os-saga-replies.fifo"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build: .
    container_name: oficina_api
    ports:
      - "8081:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-oficina_db}
      DB_USER: ${DB_USER:-oficina_user}
      DB_PASS: ${DB_PASS:-oficina_123}
      JWT_SECRET: ${JWT_SECRET:-ASjhd8213u41jksaJD7HS8AJDkjsaDH871A2132KJDQ293N12BDKS}
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      # X-Service-Token das chamadas internas que o OS faz (consulta de pecas na Execution) e recebe
      # (/internal/**, a Lambda de autenticacao).
      SERVICE_TOKEN: ${SERVICE_TOKEN:-token-de-servico-local}
      # Cadastro de pecas: e da Execution (oficina-execution-service), rodando na maquina (porta 8082).
      CATALOGO_PECAS_URL: ${CATALOGO_PECAS_URL:-http://host.docker.internal:8082}
      # Billing e Execution sao outros servicos (oficina-billing-service, oficina-execution-service):
      # billing-commands e execution-commands vao pelo SQS do LocalStack e as respostas voltam em
      # os-saga-replies (docs/arquitetura/mensageria-local.md).
      MENSAGERIA_SQS_HABILITADO: ${MENSAGERIA_SQS_HABILITADO:-true}
      MENSAGERIA_SQS_ENVIO: ${MENSAGERIA_SQS_ENVIO:-billing-commands,execution-commands}
      MENSAGERIA_SQS_CONSUMO: ${MENSAGERIA_SQS_CONSUMO:-os-saga-replies}
      AWS_ENDPOINT_URL_SQS: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    # host.docker.internal para chegar na Execution rodando na maquina (no Linux precisa do host-gateway).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      mailhog:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
