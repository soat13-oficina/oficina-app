spring:
  application:
    # oficina-api, e nao "oficina": este nome vai para o campo service.name do log
    # estruturado ECS. APM (DD_SERVICE), métricas e o label tags.datadoghq.com/service do
    # pod já usam "oficina-api" — divergir aqui faria o log da aplicação chegar ao Datadog
    # sob um serviço com outro nome, quebrando justamente a correlação log <-> trace que a
    # observabilidade desta fase existe para demonstrar.
    name: oficina-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/oficina_db}
    username: ${DB_USER:oficina_user}
    password: ${DB_PASS:oficina_123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    defer-datasource-initialization: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}

aws:
  ses:
    region: ${AWS_SES_REGION:us-east-1}
    remetente: ${AWS_SES_REMETENTE:}

jwt:
  secret: ${JWT_SECRET:SUA_CHAVE_SECRETA_MUITO_SEGURA_E_LONGA_PARA_O_JWT_DA_OFICINA_2026}
  expiration: 86400000 # 1 dia em milissegundos

# Header X-Service-Token das rotas /internal/** (chamadas entre servicos, fora do API Gateway).
# Segredo oficina/<env>/service-token; vazio = nenhuma chamada interna e aceita.
seguranca:
  service-token: ${SERVICE_TOKEN:}


# Health checks consumidos pelos probes do Kubernetes (k8s/base/deployment.yaml)
# e pelo HEALTHCHECK do Dockerfile:
#   /actuator/health/liveness  - processo vivo (nao inclui dependencias)
#   /actuator/health/readiness - pronto para receber trafego (inclui o banco)
#
# /actuator/prometheus expoe as metricas de negocio (oficina.os.*) para o Datadog Agent.
# ATENCAO: em nuvem o management sobe numa PORTA PROPRIA (MANAGEMENT_SERVER_PORT=8081 nos
# overlays), que de proposito NAO consta no Service - o Service e type: LoadBalancer e cria um
# NLB publico, entao qualquer coisa servida na 8080 fica exposta na internet. Localmente a porta
# continua sendo a 8080 para que um curl simples valide as metricas sem subir cluster nenhum.
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

# Tag aplicada a TODA metrica (ver MetricasCommonTagsConfig). E como um mesmo dashboard
# distingue hml de prd sem precisar duplicar widget.
observabilidade:
  ambiente: ${AMBIENTE:local}

notificacao:
  reprocessamento:
    max-tentativas: ${NOTIFICACAO_MAX_TENTATIVAS:5}
    intervalo: ${NOTIFICACAO_INTERVALO:300000} # intervalo do job em ms (5 min)
    carencia-segundos: ${NOTIFICACAO_CARENCIA:60} # janela de carência antes de reprocessar

# Mensageria da Saga (ADR 0005). Toda mensagem passa pelo outbox (outbox_mensagens). Desde o Passo 3
# o Billing e outro servico: billing-commands sai pelo SQS e as respostas dele chegam em
# os-saga-replies (ligar mensageria.sqs.* no ambiente). execution-commands continua no processo
# (estoque ainda aqui) ate o Passo 4.
mensageria:
  # source do envelope: nome logico do servico (docs/arquitetura/convencoes-de-nomes.md).
  servico: oficina-os-service
  # SQS FIFO (ADR 0005), fila a fila conforme os servicos sao extraidos. Fila fora de "envio" e
  # entregue dentro do processo (participante ainda no monolito). Nome fisico:
  # oficina-<ambiente>-<fila>.fifo. Ver docs/arquitetura/mensageria-local.md para o LocalStack.
  sqs:
    habilitado: ${MENSAGERIA_SQS_HABILITADO:false}
    envio: ${MENSAGERIA_SQS_ENVIO:}          # ex.: billing-commands
    consumo: ${MENSAGERIA_SQS_CONSUMO:}      # ex.: os-saga-replies
    ambiente: ${AMBIENTE:local}
    endpoint: ${AWS_ENDPOINT_URL_SQS:}       # LocalStack: http://localhost:4566
    regiao: ${AWS_REGION:us-east-1}
    espera: PT20S
    max-mensagens: 10
  outbox:
    agendamento-habilitado: true
    intervalo-ms: ${MENSAGERIA_OUTBOX_INTERVALO_MS:1000}
    max-tentativas: ${MENSAGERIA_OUTBOX_MAX_TENTATIVAS:5}
    lote: 100

# Saga da ordem de servico (ADR 0004). Prazos em ISO-8601 (PT15M = 15 minutos, P7D = 7 dias).
saga:
  # Prazo de decisao do cliente. Vazio = vale a validade do orcamento (producao). Curto em hml.
  prazo-decisao: ${SAGA_PRAZO_DECISAO:}
  prazo-decisao-padrao: P7D  # orcamento sem validade
  prazo-resposta: ${SAGA_PRAZO_RESPOSTA:PT5M}  # resposta a qualquer comando (avanco ou compensacao)
  max-tentativas: 3  # reenvios de um comando sem resposta antes de tratar o passo como falha
  # Prazo para o cliente pagar (vai no SolicitarPagamento). O Billing expira a cobranca; o OS so age
  # se nada chegar ate o prazo + margem (rede de seguranca).
  prazo-pagamento: ${SAGA_PRAZO_PAGAMENTO:PT24H}
  margem-pagamento: PT10M
  prazos:
    agendamento-habilitado: true
    intervalo-ms: ${SAGA_PRAZOS_INTERVALO_MS:30000}

