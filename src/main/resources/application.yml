spring:
  application:
    name: oficina

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/oficina_db}
    username: ${DB_USER:oficina_user}
    password: ${DB_PASS:oficina_123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    defer-datasource-initialization: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}

aws:
  ses:
    region: ${AWS_SES_REGION:us-east-1}
    remetente: ${AWS_SES_REMETENTE:}

jwt:
  secret: ${JWT_SECRET:SUA_CHAVE_SECRETA_MUITO_SEGURA_E_LONGA_PARA_O_JWT_DA_OFICINA_2026}
  expiration: 86400000 # 1 dia em milissegundos


# Health checks consumidos pelos probes do Kubernetes (k8s/03-deployment.yaml)
# e pelo HEALTHCHECK do Dockerfile:
#   /actuator/health/liveness  - processo vivo (nao inclui dependencias)
#   /actuator/health/readiness - pronto para receber trafego (inclui o banco)
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

orcamento:
  webhook:
    secret: ${ORCAMENTO_WEBHOOK_SECRET:segredo-desenvolvimento}

notificacao:
  reprocessamento:
    max-tentativas: ${NOTIFICACAO_MAX_TENTATIVAS:5}
    intervalo: ${NOTIFICACAO_INTERVALO:300000} # intervalo do job em ms (5 min)
    carencia-segundos: ${NOTIFICACAO_CARENCIA:60} # janela de carência antes de reprocessar
