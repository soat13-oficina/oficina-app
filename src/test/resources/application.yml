spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

  mail:
    host: localhost
    port: 1025
    username:
    password:

jwt:
  secret: chave-secreta-de-teste-para-rodar-os-testes-unitarios-2026
  expiration: 86400000

seguranca:
  service-token: token-de-servico-de-teste

notificacao:
  reprocessamento:
    max-tentativas: 3
    intervalo: 300000
    carencia-segundos: 60

# Os testes chamam o PublicadorOutbox direto; o agendamento concorreria com eles.
mensageria:
  servico: oficina-os-service
  outbox:
    agendamento-habilitado: false

# Os testes aplicam os prazos chamando o orquestrador com o relogio que quiserem.
saga:
  prazos:
    agendamento-habilitado: false

