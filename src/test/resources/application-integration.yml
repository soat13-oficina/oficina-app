# Perfil de integração: o datasource (url/usuário/senha) é provido em tempo de execução
# pelo container PostgreSQL do Testcontainers via @ServiceConnection (ver PostgresIntegrationTest).
spring:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: false
