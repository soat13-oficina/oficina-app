spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/oficina_db}
    username: ${DB_USER:oficina_user}
    password: ${DB_PASS:oficina_123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}

orcamento:
  webhook:
    secret: ${ORCAMENTO_WEBHOOK_SECRET:segredo-teste-integracao}

notificacao:
  reprocessamento:
    max-tentativas: 3
    intervalo: 300000
    carencia-segundos: 60
