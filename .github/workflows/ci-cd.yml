name: CI/CD

# Fluxo: build + testes -> imagem Docker no ECR -> deploy no EKS.
# Pressupoe a infraestrutura ja provisionada (workflow "Infraestrutura"
# ou terraform apply local - ver infra/README.md).
#
# Configuracao necessaria no repositorio:
#   Secrets: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
#   Variables (opcional): AWS_REGION (default us-east-1)

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  ECR_REPOSITORY: oficina
  EKS_CLUSTER: oficina
  DB_IDENTIFIER: oficina-db

jobs:
  unit-tests:
    name: Build e testes unitarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # mvn verify roda o build, os testes unitarios e o gate de cobertura
      # do JaCoCo ja configurado no pom.xml (minimo 80% por modulo).
      - name: Build + testes unitarios (cobertura JaCoCo)
        run: ./mvnw --batch-mode clean verify

      - name: Publica relatorio de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

  integration-tests:
    name: Testes de integracao (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: oficina_user
          POSTGRES_PASSWORD: oficina_123
          POSTGRES_DB: oficina_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oficina_user -d oficina_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Testes de integracao contra PostgreSQL real
        run: ./mvnw --batch-mode test -Dspring.profiles.active=integration

  build-image:
    name: Build e push da imagem para o ECR
    needs: [unit-tests, integration-tests]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - id: image
        name: Define a tag da imagem (sha curto do commit)
        run: echo "image=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.image }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy no EKS
    needs: build-image
    runs-on: ubuntu-latest
    concurrency: deploy-eks
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Aponta kubectl para o cluster
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER"

      # O RDS gerencia usuario/senha no Secrets Manager (ver infra/aws/rds.tf).
      # Aqui descobrimos endpoint + credenciais e materializamos o Secret
      # oficina-db-credentials que o Deployment consome.
      - name: Descobre endpoint e credenciais do banco
        id: db
        run: |
          RDS_HOST=$(aws rds describe-db-instances --db-instance-identifier "$DB_IDENTIFIER" \
            --query 'DBInstances[0].Endpoint.Address' --output text)
          RDS_PORT=$(aws rds describe-db-instances --db-instance-identifier "$DB_IDENTIFIER" \
            --query 'DBInstances[0].Endpoint.Port' --output text)
          SECRET_ARN=$(aws rds describe-db-instances --db-instance-identifier "$DB_IDENTIFIER" \
            --query 'DBInstances[0].MasterUserSecret.SecretArn' --output text)
          CREDS=$(aws secretsmanager get-secret-value --secret-id "$SECRET_ARN" \
            --query SecretString --output text)
          DB_USER=$(echo "$CREDS" | jq -r .username)
          DB_PASS=$(echo "$CREDS" | jq -r .password)
          echo "::add-mask::$DB_PASS"
          echo "rds_endpoint=$RDS_HOST:$RDS_PORT" >> "$GITHUB_OUTPUT"
          echo "db_user=$DB_USER" >> "$GITHUB_OUTPUT"
          echo "db_pass=$DB_PASS" >> "$GITHUB_OUTPUT"

      - name: Cria namespace e Secret de credenciais do banco
        run: |
          kubectl apply -f k8s/00-namespace.yaml
          kubectl create secret generic oficina-db-credentials \
            --namespace oficina \
            --from-literal=POSTGRES_USER='${{ steps.db.outputs.db_user }}' \
            --from-literal=POSTGRES_PASSWORD='${{ steps.db.outputs.db_pass }}' \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Aplica manifestos Kubernetes da aplicacao
        run: |
          sed -i "s#__RDS_ENDPOINT__#${{ steps.db.outputs.rds_endpoint }}#" k8s/01-configmap.yaml
          sed -i "s#__IMAGE__#${{ needs.build-image.outputs.image }}#" k8s/03-deployment.yaml
          kubectl apply -f k8s/

      - name: Aguarda rollout da aplicacao
        run: kubectl -n oficina rollout status deployment/oficina-api --timeout=300s

      - name: Evidencias do deploy (pods, service, HPA, URL publica)
        run: |
          kubectl -n oficina get pods,svc,hpa
          kubectl -n oficina top pods || echo "metrics-server ainda sem amostras coletadas"
          echo "URL publica da API:"
          kubectl -n oficina get svc oficina-api -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' && echo
