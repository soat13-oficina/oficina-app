name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  unit-tests:
    name: Build e testes unitarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # mvn verify roda o build, os testes unitarios e o gate de cobertura
      # do JaCoCo ja configurado no pom.xml (minimo 80% por modulo).
      - name: Build + testes unitarios (cobertura JaCoCo)
        run: ./mvnw --batch-mode clean verify

      - name: Publica relatorio de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

  integration-tests:
    name: Testes de integracao (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: oficina_user
          POSTGRES_PASSWORD: oficina_123
          POSTGRES_DB: oficina_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oficina_user -d oficina_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Testes de integracao contra PostgreSQL real
        run: ./mvnw --batch-mode test -Dspring.profiles.active=integration

  build-image:
    name: Build e push da imagem Docker
    needs: [unit-tests, integration-tests]
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.first-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # docker/metadata-action gera varias tags separadas por linha; pegamos
      # a primeira (a tag com o sha) para usar no Deployment durante o deploy.
      - id: first-tag
        run: echo "tag=$(echo '${{ steps.meta.outputs.tags }}' | head -n1)" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy no Kubernetes (cluster efemero via kind)
    needs: build-image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.15.7'

      - name: Provisiona cluster Kubernetes (kind) + metrics-server
        working-directory: infra/cluster
        run: |
          terraform init
          terraform apply -auto-approve

      - name: Exporta KUBECONFIG
        run: echo "KUBECONFIG=$GITHUB_WORKSPACE/infra/cluster/kubeconfig" >> "$GITHUB_ENV"

      - name: Provisiona banco de dados
        working-directory: infra/database
        run: |
          terraform init
          terraform apply -auto-approve

      - name: Aplica manifestos Kubernetes da aplicacao
        run: |
          sed -i "s#ghcr.io/gustav13/oficina:latest#${{ needs.build-image.outputs.image_tag }}#" k8s/03-deployment.yaml
          kubectl apply -f k8s/

      - name: Aguarda rollout da aplicacao
        run: kubectl -n oficina rollout status deployment/oficina-api --timeout=180s

      - name: Evidencias do deploy (pods, service, HPA)
        run: |
          kubectl -n oficina get pods,svc,hpa,statefulset
          kubectl -n oficina top pods || echo "metrics-server ainda sem amostras coletadas"
