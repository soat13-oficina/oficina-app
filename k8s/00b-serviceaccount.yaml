# ServiceAccount usada pelo pod da API, associada via IRSA (IAM Roles for
# Service Accounts) a uma IAM Role com permissao "ses:SendEmail". O SesClient
# (profile "ses") resolve credenciais automaticamente a partir dessa Role via
# DefaultCredentialsProvider — nenhuma credencial estatica e armazenada em
# Secret do Kubernetes.
#
# __SES_IAM_ROLE_ARN__ e substituido pela pipeline de CI/CD (ou manualmente)
# pelo ARN real da Role provisionada no Terraform:
#   ROLE_ARN=$(cd infra/aws && terraform output -raw ses_role_arn)
#   sed -i "s#__SES_IAM_ROLE_ARN__#$ROLE_ARN#" k8s/00b-serviceaccount.yaml
#
# Pre-requisito de infraestrutura: a IAM Role e sua policy (ses:SendEmail)
# devem existir antes do deploy do profile "ses" — provisionamento fora
# deste repositorio de aplicacao.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: oficina-api
  namespace: oficina
  labels:
    app: oficina-api
  annotations:
    eks.amazonaws.com/role-arn: "__SES_IAM_ROLE_ARN__"
