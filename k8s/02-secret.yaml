# ATENCAO: valor de demonstracao, no mesmo espirito do JWT_SECRET
# hardcoded hoje em docker-compose.yml. Aceitavel para o ambiente de
# demo do desafio, mas NUNCA use este valor em um ambiente real:
#
#   kubectl create secret generic oficina-app-secrets \
#     --namespace oficina \
#     --from-literal=JWT_SECRET="$(openssl rand -base64 48)" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
apiVersion: v1
kind: Secret
metadata:
  name: oficina-app-secrets
  namespace: oficina
  labels:
    app: oficina-api
type: Opaque
stringData:
  JWT_SECRET: "ASjhd8213u41jksaJD7HS8AJDkjsaDH871A2132KJDQ293N12BDKS"
  # Mesmo alerta acima: valor de demonstracao. Override real:
  #   kubectl create secret generic oficina-app-secrets \
  #     --namespace oficina \
  #     --from-literal=ORCAMENTO_WEBHOOK_SECRET="$(openssl rand -base64 48)" \
  #     --dry-run=client -o yaml | kubectl apply -f -
  ORCAMENTO_WEBHOOK_SECRET: "segredo-demonstracao-webhook-orcamento"
