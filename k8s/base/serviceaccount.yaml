# ServiceAccount usada pelo pod da API, associada via IRSA (IAM Roles for
# Service Accounts) à IAM Role oficina-<env>-oficina-os-service: filas SQS da
# Saga e "ses:SendEmail". O SesClient e o SqsClient resolvem credenciais a
# partir dessa Role via DefaultCredentialsProvider — nenhuma credencial
# estática é armazenada em Secret do Kubernetes.
#
# A Role é provisionada pelo infra/ deste repositório e confia só neste
# ServiceAccount, no namespace do ambiente. A anotação com o ARN real é
# aplicada pelo patch-serviceaccount.yaml de cada overlay, preenchido pela
# pipeline.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: oficina-api
  labels:
    app: oficina-api
