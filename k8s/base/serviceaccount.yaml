# ServiceAccount usada pelo pod da API, associada via IRSA (IAM Roles for
# Service Accounts) a uma IAM Role com permissão "ses:SendEmail". O SesClient
# (profile "ses") resolve credenciais automaticamente a partir dessa Role via
# DefaultCredentialsProvider — nenhuma credencial estática é armazenada em
# Secret do Kubernetes.
#
# A Role é provisionada FORA deste repositório, pelo Terraform de
# oficina-infra-k8s (iam-ses.tf), e confia neste ServiceAccount nos dois
# namespaces de ambiente. A anotação com o ARN real é aplicada pelo
# patch-serviceaccount.yaml de cada overlay, preenchido pela pipeline.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: oficina-api
  labels:
    app: oficina-api
