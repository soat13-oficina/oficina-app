# type LoadBalancer: a AWS provisiona um NLB público automaticamente. É o alvo
# da rota proxy do API Gateway (repositório oficina-lambda-auth) e o endereço
# usado na demonstração.
#
# IMPORTANTE: este NLB é criado pelo Kubernetes, FORA do Terraform. Antes de
# rodar "terraform destroy" no repositório oficina-infra-k8s, remova os
# recursos do cluster (kubectl delete -k k8s/overlays/<env>) ou o destroy da
# VPC trava com dependências órfãs. O job de destroy daquele repositório já
# faz essa limpeza.
apiVersion: v1
kind: Service
metadata:
  name: oficina-api
  labels:
    app: oficina-api
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
spec:
  type: LoadBalancer
  selector:
    app: oficina-api
  ports:
    - name: http
      port: 80
      targetPort: 8080
