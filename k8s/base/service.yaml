# ClusterIP: o acesso externo e pelo Ingress (ALB compartilhado do ambiente, ADR 0008); Billing e
# Execution chegam aqui pelo DNS do cluster: http://oficina-api:8080.
#
# O nome do Service ainda e oficina-api; vira oficina-os-service no rename do servico
# (docs/arquitetura/convencoes-de-nomes.md).
apiVersion: v1
kind: Service
metadata:
  name: oficina-api
  labels:
    app: oficina-api
spec:
  type: ClusterIP
  selector:
    app: oficina-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
