# Namespace, imagem, réplicas e recursos NÃO são definidos aqui: vêm do overlay
# do ambiente (k8s/overlays/hml e k8s/overlays/prd).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-api
  labels:
    app: oficina-api
spec:
  selector:
    matchLabels:
      app: oficina-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: oficina-api
    spec:
      # ServiceAccount anotada com eks.amazonaws.com/role-arn (serviceaccount.yaml
      # + patch do overlay), usada pelo SesClient (profile "ses") para resolver
      # credenciais via IRSA.
      serviceAccountName: oficina-api
      containers:
        - name: oficina-api
          # Nome simbólico: o overlay substitui por <ECR>/oficina:<sha> através
          # do bloco "images:" do kustomization.yaml daquele ambiente.
          image: oficina-api
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            # ConfigMap gerado pelo configMapGenerator do overlay a partir do
            # app.env daquele ambiente. O kustomize reescreve esta referência
            # para o nome com hash, então uma mudança de configuração dispara
            # rolling update automaticamente.
            - configMapRef:
                name: oficina-config
          env:
            # Ativa NotificadorEmailSes (Amazon SES) nos dois ambientes de nuvem.
            # docker-compose.yml (dev local) não define esta variável e continua
            # resolvendo NotificadorEmailSpringMail contra o Mailhog.
            - name: SPRING_PROFILES_ACTIVE
              value: "ses"
            # Secrets criados imperativamente pela pipeline (não versionados):
            # oficina-db-credentials vem do Secrets Manager gerenciado pelo RDS;
            # oficina-app-secrets traz o JWT_SECRET compartilhado com a Lambda
            # de autenticação. Ver .github/workflows/ci-cd.yml.
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: oficina-db-credentials
                  key: POSTGRES_USER
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: oficina-db-credentials
                  key: POSTGRES_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oficina-app-secrets
                  key: JWT_SECRET
            - name: ORCAMENTO_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: oficina-app-secrets
                  key: ORCAMENTO_WEBHOOK_SECRET
          # Probes nos endpoints nativos do Spring Boot Actuator
          # (management.endpoint.health.probes em application.yml).
          # startupProbe segura liveness/readiness até a app subir (Flyway +
          # Hibernate levam dezenas de segundos com pouca CPU) - dá até 150s
          # de graça sem risco do kubelet matar o container no meio do boot.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          # readiness inclui o banco (grupo readiness = readinessState,db):
          # sem conexão com o RDS o pod sai do balanceamento do Service.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
