apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-api
  namespace: oficina
  labels:
    app: oficina-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: oficina-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: oficina-api
    spec:
      containers:
        - name: oficina-api
          # __IMAGE__ e substituido pela pipeline com a URL do ECR + tag do
          # commit (os nodes do EKS puxam do ECR via IAM role, sem pull
          # secret). Para aplicar manualmente:
          #   IMAGE=$(cd infra/aws && terraform output -raw ecr_repository_url):latest
          #   sed -i "s#__IMAGE__#$IMAGE#" k8s/03-deployment.yaml
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: oficina-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: oficina-db-credentials
                  key: POSTGRES_USER
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: oficina-db-credentials
                  key: POSTGRES_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oficina-app-secrets
                  key: JWT_SECRET
            - name: ORCAMENTO_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: oficina-app-secrets
                  key: ORCAMENTO_WEBHOOK_SECRET
            - name: SMTP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: oficina-app-secrets
                  key: SMTP_USERNAME
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: oficina-app-secrets
                  key: SMTP_PASSWORD
          resources:
            requests:
              cpu: "250m"
              memory: "384Mi"
            limits:
              cpu: "1000m"
              memory: "768Mi"
          readinessProbe:
            httpGet:
              path: /v3/api-docs
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /v3/api-docs
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
