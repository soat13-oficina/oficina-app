# Homologação e produção dividem o mesmo cluster (ver ADR 0002 em
# oficina-infra-k8s). A cota impede que um pod de homologação com vazamento de
# memória consuma os nós e derrube produção junto — é o que torna a plataforma
# compartilhada defensável.
#
# Cota de homologação deliberadamente menor que a de produção.
#
# Dimensionada para os TRÊS serviços do ambiente (OS, Billing e Execution) com o HPA no teto de 2
# réplicas: 6 pods de 150m / 256Mi de requests (900m / 1,5Gi) e 500m / 512Mi de limits (3 / 3Gi),
# mais um pod extra por serviço no rolling update (maxSurge 1): 9 pods = 1350m / 2,25Gi de requests
# e 4500m / 4,5Gi de limits. Com limits.cpu em 3, o pod extra era recusado pela cota e o rollout
# parava no meio. PLANO-FASE-4.md, seção 9.4.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: oficina-quota
spec:
  hard:
    requests.cpu: "1500m"
    requests.memory: 3Gi
    limits.cpu: "5"
    limits.memory: 5Gi
    pods: "12"
