# __IRSA_ROLE_ARN__ é substituído pela pipeline com o ARN real da Role
# oficina-hml-oficina-os-service, provisionada pelo infra/ deste repositório. Para aplicar manualmente:
#   ROLE_ARN=$(aws iam get-role --role-name oficina-hml-oficina-os-service --query Role.Arn --output text)
#   sed -i "s#__IRSA_ROLE_ARN__#$ROLE_ARN#" k8s/overlays/hml/patch-serviceaccount.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: oficina-api
  annotations:
    eks.amazonaws.com/role-arn: "__IRSA_ROLE_ARN__"
