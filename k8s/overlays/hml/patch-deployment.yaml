# Homologação: uma réplica e recursos menores. Produção tem prioridade no
# cluster compartilhado.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-api
spec:
  replicas: 1
  template:
    metadata:
      labels:
        # env do unified service tagging no lado do AGENT: e por este label que ele marca
        # os LOGS do pod com env:hml (DD_ENV, no container, so alcanca os traces).
        tags.datadoghq.com/env: "hml"
    spec:
      containers:
        - name: oficina-api
          resources:
            requests:
              cpu: "150m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
