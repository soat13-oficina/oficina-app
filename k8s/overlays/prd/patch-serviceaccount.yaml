# __SES_IAM_ROLE_ARN__ é substituído pela pipeline com o ARN real da Role
# provisionada no repositório oficina-infra-k8s. Para aplicar manualmente:
#   ROLE_ARN=$(aws iam get-role --role-name oficina-ses-send-email --query Role.Arn --output text)
#   sed -i "s#__SES_IAM_ROLE_ARN__#$ROLE_ARN#" k8s/overlays/prd/patch-serviceaccount.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: oficina-api
  annotations:
    eks.amazonaws.com/role-arn: "__SES_IAM_ROLE_ARN__"
